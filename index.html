<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Central de Demandas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#F7F7FB;min-height:100vh}
.header{background:#1A1A2E;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.header-left .sub{color:#6C63FF;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.header-left .title{color:#fff;font-size:18px;font-weight:700}
.header-right{display:flex;gap:8px;flex-shrink:0}
.btn{border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif}
.btn-purple{background:#6C63FF;color:#fff}
.btn-orange{background:#F59E0B;color:#fff}
.btn-green{background:#10B981;color:#fff}
.statusbar{background:#fff;border-bottom:1px solid #EBEBF5;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sbtn{border:none;background:none;padding:12px 16px;cursor:pointer;border-bottom:3px solid transparent;font-size:12px;white-space:nowrap;color:#888;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
.sbtn.on{color:#6C63FF;border-bottom-color:#6C63FF;font-weight:700}
.badge{border-radius:20px;padding:1px 6px;font-size:10px;margin-left:3px}
.content{padding:12px}
.search{width:100%;padding:10px 14px;border:1px solid #EBEBF5;border-radius:10px;font-size:13px;background:#fff;outline:none;font-family:'Inter',sans-serif;margin-bottom:12px}
.form-box{background:#fff;border-radius:14px;padding:16px;border:2px solid #6C63FF;margin-bottom:12px}
.form-title{font-weight:700;font-size:14px;margin-bottom:12px;color:#1A1A2E}
.inp{width:100%;padding:9px 12px;border:1px solid #EBEBF5;border-radius:8px;font-size:13px;margin-bottom:8px;outline:none;font-family:'Inter',sans-serif}
textarea.inp{resize:vertical}
.row2{display:flex;gap:8px;margin-bottom:8px}
.row2 select,.row2 input{flex:1;padding:8px 10px;border:1px solid #EBEBF5;border-radius:8px;font-size:12px;outline:none;font-family:'Inter',sans-serif}
.btn-row{display:flex;gap:8px;margin-top:4px}
.btn-row .btn{flex:1;padding:10px}
.btn-cancel{background:#F7F7FB;color:#888;border:1px solid #EBEBF5}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;border:2px solid transparent;box-shadow:0 1px 6px rgba(0,0,0,0.05);-webkit-tap-highlight-color:transparent;cursor:pointer}
.card.sel{border-color:#6C63FF}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-title{font-weight:600;font-size:13px;color:#1A1A2E;line-height:1.4;flex:1}
.prio{border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap}
.card-desc{font-size:11px;color:#999;margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-bot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.pill{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
.meta{font-size:10px;color:#bbb;display:flex;gap:6px}
.empty{text-align:center;padding:48px 16px;color:#aaa}
.empty-icon{font-size:40px;margin-bottom:10px}

/* DETAIL */
.detail-box{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.detail-title{font-weight:700;font-size:16px;color:#1A1A2E;margin-bottom:6px}
.detail-desc{font-size:13px;color:#888;line-height:1.5;margin-bottom:10px}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{background:#F0EEFF;color:#6C63FF;border-radius:6px;padding:3px 8px;font-size:11px}
.status-sel{border:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;outline:none;font-family:'Inter',sans-serif}
.del-btn{background:#FEF2F2;color:#EF4444;border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-left:auto}
.back-btn{background:#F7F7FB;color:#6C63FF;border:1px solid #EBEBF5;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:12px}

/* CHAT */
.chat-box{background:#fff;border-radius:14px;overflow:hidden}
.chat-msgs{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:50vh;overflow-y:auto}
.msg-user{align-self:flex-end;background:#6C63FF;color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;font-size:13px;line-height:1.5;max-width:85%}
.msg-ai{align-self:flex-start;background:#F7F7FB;color:#1A1A2E;border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:13px;line-height:1.5;max-width:85%}
.chat-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #EBEBF5}
.chat-inp{flex:1;padding:10px 12px;border:1px solid #EBEBF5;border-radius:10px;font-size:13px;outline:none;font-family:'Inter',sans-serif;background:#F7F7FB}
.send{background:#6C63FF;color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.send:disabled{background:#C4C0FF;cursor:not-allowed}
.suggestions{padding:16px;text-align:center}
.sug-btn{background:#F7F7FB;border:1px solid #EBEBF5;border-radius:20px;padding:7px 12px;font-size:12px;color:#6C63FF;cursor:pointer;font-family:'Inter',sans-serif;margin:3px;display:inline-block}
.warn-box{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:10px 14px;font-size:12px;color:#92400E;margin-top:12px}
.warn-box button{background:none;border:none;color:#6C63FF;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:400px}
.modal-title{font-weight:700;font-size:15px;margin-bottom:8px;color:#1A1A2E}
.modal-desc{font-size:13px;color:#888;margin-bottom:14px;line-height:1.6}
.modal-desc a{color:#6C63FF}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.dot{width:7px;height:7px;border-radius:50%;background:#6C63FF;display:inline-block;margin:0 2px}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="sub">Suas Demandas</div>
    <div class="title">Central de Projetos</div>
  </div>
  <div class="header-right">
    <button class="btn btn-orange" id="aiBtn" onclick="openModal()">⚙ IA</button>
    <button class="btn btn-purple" onclick="abrirForm()">+ Nova</button>
  </div>
</div>

<div class="statusbar" id="statusbar"></div>

<div class="content" id="app"></div>

<div class="overlay" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-title">Configurar chave de API</div>
    <div class="modal-desc">Crie uma chave grátis em <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys → Create Key. Fica salva só no seu celular.</div>
    <input class="inp" id="apiInp" placeholder="sk-ant-..."/>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-purple" onclick="salvarChave()">Salvar</button>
      <button class="btn btn-cancel" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
var STATUS = {
  nova:{l:'Nova',c:'#6C63FF',b:'#F0EEFF'},
  em_andamento:{l:'Em andamento',c:'#F59E0B',b:'#FFFBEB'},
  bloqueada:{l:'Bloqueada',c:'#EF4444',b:'#FEF2F2'},
  concluida:{l:'Concluída',c:'#10B981',b:'#ECFDF5'}
};
var PRIO = {
  alta:{l:'Alta',c:'#EF4444'},
  media:{l:'Média',c:'#F59E0B'},
  baixa:{l:'Baixa',c:'#10B981'}
};

var tasks = JSON.parse(localStorage.getItem('gd2')||'[]');
var selId = null;
var filtro = 'todas';
var msgs = [];
var loading = false;
var apiKey = localStorage.getItem('gd_key')||'';
var mostrandoForm = false;

function save(){ localStorage.setItem('gd2', JSON.stringify(tasks)); }

function renderBar(){
  var counts = {};
  Object.keys(STATUS).forEach(function(k){ counts[k] = tasks.filter(function(t){return t.status===k;}).length; });
  var arr = [{k:'todas',l:'Todas',c:'#6C63FF',n:tasks.length}];
  Object.keys(STATUS).forEach(function(k){ arr.push({k:k,l:STATUS[k].l,c:STATUS[k].c,n:counts[k]||0}); });
  document.getElementById('statusbar').innerHTML = arr.map(function(f){
    var on = filtro===f.k;
    return '<button class="sbtn'+(on?' on':'')+'" onclick="setFiltro(\''+f.k+'\')">'+f.l+'<span class="badge" style="background:'+(on?f.c:'#F0EEFF')+';color:'+(on?'#fff':f.c)+'">'+f.n+'</span></button>';
  }).join('');
}

function setFiltro(s){ filtro=s; selId=null; msgs=[]; renderBar(); render(); }

function render(){
  if(selId){ renderDetalhe(); return; }
  var q = document.querySelector('.search') ? document.querySelector('.search').value.toLowerCase() : '';
  var list = tasks.filter(function(t){
    return (filtro==='todas'||t.status===filtro) && (t.titulo.toLowerCase().indexOf(q)>=0||(t.descricao||'').toLowerCase().indexOf(q)>=0);
  });
  var html = '<input class="search" placeholder="Buscar demandas..." oninput="render()" value="'+(q||'')+'"/>';
  if(mostrandoForm){
    html += '<div class="form-box"><div class="form-title">Nova demanda</div>'+
      '<input class="inp" id="ft" placeholder="Título*"/>'+
      '<textarea class="inp" id="fd" rows="2" placeholder="Descrição (opcional)"></textarea>'+
      '<div class="row2"><select id="fp"><option value="alta">Alta prioridade</option><option value="media" selected>Média prioridade</option><option value="baixa">Baixa prioridade</option></select>'+
      '<input type="date" id="fpr"/></div>'+
      '<input class="inp" id="ftg" placeholder="Tags (vírgula)"/>'+
      '<div class="btn-row"><button class="btn btn-purple" onclick="addTask()">Adicionar</button><button class="btn btn-cancel" onclick="cancelarForm()">Cancelar</button></div>'+
      '</div>';
  }
  if(!list.length){
    html += '<div class="empty"><div class="empty-icon">📋</div><div style="font-weight:600;color:#888;font-size:14px;margin-bottom:6px">'+(tasks.length===0?'Nenhuma demanda ainda':'Nada encontrado')+'</div><div style="font-size:12px;color:#bbb">'+(tasks.length===0?'Toque em + Nova para começar':'Tente outro filtro')+'</div></div>';
  } else {
    list.forEach(function(t){
      html += '<div class="card" onclick="selTask('+t.id+')">'+
        '<div class="card-top"><div class="card-title">'+t.titulo+'</div>'+
        '<div class="prio" style="background:'+PRIO[t.prioridade].c+'22;color:'+PRIO[t.prioridade].c+'">'+PRIO[t.prioridade].l+'</div></div>'+
        (t.descricao?'<div class="card-desc">'+t.descricao+'</div>':'')+
        '<div class="card-bot"><div class="pill" style="background:'+STATUS[t.status].b+';color:'+STATUS[t.status].c+'">'+STATUS[t.status].l+'</div>'+
        '<div class="meta">'+(t.prazo?'📅 '+t.prazo:'')+(t.tags&&t.tags.length?' 🏷 '+t.tags[0]+(t.tags.length>1?' +'+(t.tags.length-1):''):'')+'</div></div></div>';
    });
  }
  document.getElementById('app').innerHTML = html;
  if(apiKey){ document.getElementById('aiBtn').className='btn btn-green'; document.getElementById('aiBtn').textContent='✓ IA'; }
}

function abrirForm(){ mostrandoForm=true; selId=null; render(); }
function cancelarForm(){ mostrandoForm=false; render(); }

function addTask(){
  var titulo = document.getElementById('ft').value.trim();
  if(!titulo){ alert('Coloca um título!'); return; }
  var t = {
    id: Date.now(),
    titulo: titulo,
    descricao: document.getElementById('fd').value,
    status: 'nova',
    prioridade: document.getElementById('fp').value,
    prazo: document.getElementById('fpr').value,
    tags: document.getElementById('ftg').value.split(',').map(function(x){return x.trim();}).filter(Boolean)
  };
  tasks.unshift(t); save(); mostrandoForm=false;
  msgs=[{r:'a',t:'Demanda "'+t.titulo+'" adicionada! Posso montar um plano de ação, levantar riscos ou definir próximos passos.'}];
  selId=t.id; renderBar(); render();
}

function selTask(id){ selId=id; msgs=[]; render(); }

function renderDetalhe(){
  var t = tasks.find(function(x){return x.id===selId;});
  if(!t){ selId=null; render(); return; }
  var statusOpts = Object.keys(STATUS).map(function(k){
    return '<option value="'+k+'"'+(t.status===k?' selected':'')+'>'+STATUS[k].l+'</option>';
  }).join('');
  var msgsHtml = '';
  if(!msgs.length){
    msgsHtml = '<div class="suggestions">'+
      '<div style="font-size:28px;margin-bottom:8px">✨</div>'+
      '<div style="font-weight:600;color:#1A1A2E;font-size:13px;margin-bottom:4px">Assistente de demanda</div>'+
      '<div style="color:#aaa;font-size:12px;margin-bottom:14px">Posso montar plano de ação, levantar riscos ou definir próximos passos.</div>'+
      ['Monte um plano de ação','Quais os riscos?','Próximos passos?','Como priorizar?'].map(function(s){
        return '<span class="sug-btn" onclick="usarSug(\''+s+'\')">'+s+'</span>';
      }).join('')+
      (!apiKey?'<div class="warn-box">⚠️ Configure a chave de API para usar a IA. <button onclick="openModal()">Configurar</button></div>':'')+
      '</div>';
  } else {
    msgsHtml = msgs.map(function(m){
      return '<div class="'+(m.r==='u'?'msg-user':'msg-ai')+'">'+md(m.t)+'</div>';
    }).join('');
    if(loading) msgsHtml += '<div class="msg-ai"><span class="dot" style="animation:pulse 1s 0s infinite"></span><span class="dot" style="animation:pulse 1s .2s infinite"></span><span class="dot" style="animation:pulse 1s .4s infinite"></span></div>';
  }
  var html =
    '<button class="back-btn" onclick="voltar()">← Voltar</button>'+
    '<div class="detail-box">'+
      '<div class="detail-title">'+t.titulo+'</div>'+
      (t.descricao?'<div class="detail-desc">'+t.descricao+'</div>':'')+
      '<div class="detail-tags">'+
        '<select class="status-sel" style="background:'+STATUS[t.status].b+';color:'+STATUS[t.status].c+'" onchange="mudaStatus('+t.id+',this.value)">'+statusOpts+'</select>'+
        '<span class="pill" style="background:'+PRIO[t.prioridade].c+'22;color:'+PRIO[t.prioridade].c+'">'+PRIO[t.prioridade].l+'</span>'+
        (t.prazo?'<span style="font-size:11px;color:#aaa">📅 '+t.prazo+'</span>':'')+
        (t.tags||[]).map(function(tg){return '<span class="tag">#'+tg+'</span>';}).join('')+
        '<button class="del-btn" onclick="delTask('+t.id+')">Excluir</button>'+
      '</div>'+
    '</div>'+
    '<div class="chat-box">'+
      '<div class="chat-msgs" id="chatMsgs">'+msgsHtml+'</div>'+
      '<div class="chat-input-row">'+
        '<input class="chat-inp" id="chatInp" placeholder="'+(apiKey?'Pergunte sobre esta demanda...':'Configure a IA primeiro...')+'" onkeydown="if(event.key===\'Enter\'){event.preventDefault();enviar()}"/>'+
        '<button class="send" onclick="enviar()" '+(loading?'disabled':'')+'>↑</button>'+
      '</div>'+
    '</div>';
  document.getElementById('app').innerHTML = html;
  var cm = document.getElementById('chatMsgs');
  if(cm) cm.scrollTop = cm.scrollHeight;
}

function md(t){
  return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/^(\d+)\.\s/gm,'<br><strong>$1.</strong> ')
    .replace(/^[-•]\s/gm,'<br>• ')
    .replace(/\n/g,'<br>');
}

function voltar(){ selId=null; msgs=[]; render(); }

function mudaStatus(id,s){
  tasks=tasks.map(function(t){return t.id===id?Object.assign({},t,{status:s}):t;});
  save(); renderBar(); renderDetalhe();
}

function delTask(id){
  if(!confirm('Excluir esta demanda?')) return;
  tasks=tasks.filter(function(t){return t.id!==id;});
  save(); selId=null; msgs=[]; renderBar(); render();
}

function usarSug(s){
  if(!apiKey){openModal();return;}
  document.getElementById('chatInp').value=s;
  enviar();
}

function enviar(){
  if(loading) return;
  var inp = document.getElementById('chatInp');
  var txt = inp.value.trim();
  if(!txt) return;
  if(!apiKey){openModal();return;}
  inp.value='';
  msgs.push({r:'u',t:txt});
  loading=true;
  renderDetalhe();

  var t = tasks.find(function(x){return x.id===selId;});
  var ctx = t?'Demanda: "'+t.titulo+'", Status: '+STATUS[t.status].l+', Prioridade: '+PRIO[t.prioridade].l+', Descrição: "'+(t.descricao||'sem descrição')+'", Prazo: '+(t.prazo||'não definido')+'.':'';

  var apiMsgs = msgs.map(function(m){return {role:m.r==='u'?'user':'assistant',content:m.t};});

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',max_tokens:1000,
      system:'Você é uma assistente de gestão de demandas. '+ctx+' Responda em português, de forma concisa e prática.',
      messages:apiMsgs
    })
  }).then(function(r){return r.json();}).then(function(data){
    var text = data.error ? 'Erro: '+data.error.message : data.content.map(function(i){return i.text||'';}).join('');
    msgs.push({r:'a',t:text});
    loading=false;
    renderDetalhe();
  }).catch(function(e){
    msgs.push({r:'a',t:'Erro de conexão: '+e.message});
    loading=false;
    renderDetalhe();
  });
}

function openModal(){
  document.getElementById('apiInp').value=apiKey;
  document.getElementById('modal').style.display='flex';
}
function fecharModal(){ document.getElementById('modal').style.display='none'; }
function salvarChave(){
  apiKey=document.getElementById('apiInp').value.trim();
  localStorage.setItem('gd_key',apiKey);
  fecharModal();
  if(apiKey){ document.getElementById('aiBtn').className='btn btn-green'; document.getElementById('aiBtn').textContent='✓ IA'; }
  if(selId) renderDetalhe(); else render();
}

renderBar();
render();
</script>
</body>
</html>
