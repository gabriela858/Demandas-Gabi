<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Central de Demandas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#F7F7FB;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#DEDDF0;border-radius:4px}
.header{background:#1A1A2E;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.header-title{color:#fff;font-size:20px;font-weight:700}
.header-sub{color:#6C63FF;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
.btn-primary{background:#6C63FF;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer}
.btn-secondary{background:#F7F7FB;color:#888;border:1px solid #EBEBF5;border-radius:10px;padding:10px 18px;font-size:13px;cursor:pointer}
.btn-ai{background:#10B981;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:12px;cursor:pointer;font-weight:600;margin-right:8px}
.btn-ai.off{background:#F59E0B}
.statusbar{background:#fff;border-bottom:1px solid #EBEBF5;display:flex;overflow-x:auto}
.statusbtn{border:none;background:none;padding:14px 18px;cursor:pointer;border-bottom:3px solid transparent;font-size:13px;white-space:nowrap;color:#888;font-family:'Inter',sans-serif}
.statusbtn.active{color:#6C63FF;border-bottom:3px solid #6C63FF;font-weight:700}
.badge{border-radius:20px;padding:1px 7px;font-size:11px;margin-left:4px}
.main{display:flex;height:calc(100vh - 112px)}
.sidebar{width:360px;min-width:360px;border-right:1px solid #EBEBF5;background:#F7F7FB;overflow-y:auto;display:flex;flex-direction:column}
.sidebar.full{width:100%;min-width:unset;border-right:none}
.detail{flex:1;display:flex;flex-direction:column;overflow:hidden}
.search{margin:16px 16px 8px;padding:10px 14px;border:1px solid #EBEBF5;border-radius:10px;font-size:13px;background:#fff;outline:none;width:calc(100% - 32px);font-family:'Inter',sans-serif}
.form-card{margin:8px 16px 0;background:#fff;border-radius:14px;padding:18px;border:2px solid #6C63FF;box-shadow:0 4px 20px rgba(108,99,255,0.1)}
.input{width:100%;padding:9px 12px;border:1px solid #EBEBF5;border-radius:8px;font-size:13px;margin-bottom:8px;outline:none;font-family:'Inter',sans-serif}
textarea.input{resize:vertical}
.row{display:flex;gap:8px;margin-bottom:8px}
.row select,.row input[type=date]{flex:1;padding:8px 10px;border:1px solid #EBEBF5;border-radius:8px;font-size:12px;outline:none;font-family:'Inter',sans-serif}
.task-card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;border:2px solid transparent;box-shadow:0 1px 6px rgba(0,0,0,0.04);transition:border 0.15s}
.task-card.selected{border:2px solid #6C63FF}
.task-title{font-weight:600;font-size:13px;color:#1A1A2E;line-height:1.4}
.task-desc{font-size:11px;color:#999;margin-top:4px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.task-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.pill{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
.prio-pill{border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700}
.meta{font-size:10px;color:#bbb;display:flex;gap:6px;align-items:center}
.empty{text-align:center;padding:48px 0;color:#aaa}
.empty-icon{font-size:40px;margin-bottom:12px}
.detail-header{background:#fff;padding:20px 24px 16px;border-bottom:1px solid #EBEBF5}
.detail-title{font-weight:700;font-size:17px;color:#1A1A2E;margin-bottom:6px}
.detail-desc{font-size:13px;color:#888;line-height:1.5}
.detail-tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tag{background:#F0EEFF;color:#6C63FF;border-radius:6px;padding:3px 8px;font-size:11px}
.chat{flex:1;overflow-y:auto;padding:16px 24px;background:#F7F7FB;display:flex;flex-direction:column;gap:12px}
.chat-suggestions{text-align:center;padding:32px 0}
.suggestion-btn{background:#fff;border:1px solid #EBEBF5;border-radius:20px;padding:7px 14px;font-size:12px;color:#6C63FF;cursor:pointer;font-weight:500;margin:4px;font-family:'Inter',sans-serif}
.msg{max-width:80%;padding:11px 15px;font-size:13px;line-height:1.6;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.msg.user{align-self:flex-end;background:#6C63FF;color:#fff;border-radius:14px 14px 4px 14px}
.msg.assistant{align-self:flex-start;background:#fff;color:#1A1A2E;border-radius:14px 14px 14px 4px}
.chat-input-row{background:#fff;padding:12px 16px;border-top:1px solid #EBEBF5;display:flex;gap:8px}
.chat-input{flex:1;padding:10px 14px;border:1px solid #EBEBF5;border-radius:10px;font-size:13px;outline:none;background:#F7F7FB;font-family:'Inter',sans-serif}
.send-btn{background:#6C63FF;color:#fff;border:none;border-radius:10px;padding:0 18px;font-weight:700;font-size:16px;cursor:pointer}
.send-btn:disabled{background:#E0DFFF;cursor:not-allowed}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:16px;padding:28px;max-width:440px;width:100%}
.modal-title{font-weight:700;font-size:16px;margin-bottom:8px;color:#1A1A2E}
.modal-desc{font-size:13px;color:#888;margin-bottom:16px;line-height:1.6}
.modal-desc a{color:#6C63FF}
.warning{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:12px 16px;font-size:12px;color:#92400E;margin-top:16px}
.warning button{background:none;border:none;color:#6C63FF;cursor:pointer;font-weight:700;font-size:12px;font-family:'Inter',sans-serif}
.delete-btn{margin-left:auto;background:#FEF2F2;color:#EF4444;border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.status-select{border:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;outline:none;font-family:'Inter',sans-serif}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.dot{width:7px;height:7px;border-radius:50%;background:#6C63FF;display:inline-block}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-sub">Suas Demandas</div>
    <div class="header-title">Central de Projetos</div>
  </div>
  <div style="display:flex;align-items:center">
    <button class="btn-ai off" id="aiBtn" onclick="openApiModal()">⚙ Configurar IA</button>
    <button class="btn-primary" onclick="showForm()">+ Nova demanda</button>
  </div>
</div>

<div class="statusbar" id="statusbar"></div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <input class="search" placeholder="Buscar demandas..." oninput="renderList()" id="searchInput"/>
    <div id="formArea"></div>
    <div id="taskList" style="padding:8px 16px 16px"></div>
  </div>
  <div class="detail" id="detail" style="display:none"></div>
</div>

<div class="modal-overlay" id="apiModal" style="display:none">
  <div class="modal">
    <div class="modal-title">Configurar chave de API</div>
    <div class="modal-desc">Para usar a IA, você precisa de uma chave da Anthropic. Crie gratuitamente em <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>. A chave fica salva só no seu navegador.</div>
    <input class="input" id="apiKeyInput" placeholder="sk-ant-..."/>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn-primary" style="flex:1" onclick="saveApiKey()">Salvar</button>
      <button class="btn-secondary" style="flex:1" onclick="closeApiModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const STATUS = {
  nova:{label:'Nova',color:'#6C63FF',bg:'#F0EEFF'},
  em_andamento:{label:'Em andamento',color:'#F59E0B',bg:'#FFFBEB'},
  bloqueada:{label:'Bloqueada',color:'#EF4444',bg:'#FEF2F2'},
  concluida:{label:'Concluída',color:'#10B981',bg:'#ECFDF5'}
};
const PRIO = {
  alta:{label:'Alta',color:'#EF4444'},
  media:{label:'Média',color:'#F59E0B'},
  baixa:{label:'Baixa',color:'#10B981'}
};

let tasks = JSON.parse(localStorage.getItem('gd_tasks')||'[]');
let selectedId = null;
let filterStatus = 'todas';
let aiMessages = [];
let aiLoading = false;
let apiKey = localStorage.getItem('gd_apikey')||'';

function save(){localStorage.setItem('gd_tasks',JSON.stringify(tasks))}

function renderStatusBar(){
  const sb = document.getElementById('statusbar');
  const filters = [{key:'todas',label:'Todas',color:'#6C63FF',count:tasks.length},
    ...Object.entries(STATUS).map(([k,v])=>({key:k,label:v.label,color:v.color,count:tasks.filter(t=>t.status===k).length}))];
  sb.innerHTML = filters.map(f=>`
    <button class="statusbtn ${filterStatus===f.key?'active':''}" onclick="setFilter('${f.key}')">
      ${f.label} <span class="badge" style="background:${filterStatus===f.key?f.color:'#F0EEFF'};color:${filterStatus===f.key?'#fff':f.color}">${f.count}</span>
    </button>`).join('');
}

function setFilter(s){filterStatus=s;renderStatusBar();renderList()}

function renderList(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = tasks.filter(t=>{
    const ms = filterStatus==='todas'||t.status===filterStatus;
    const mq = t.titulo.toLowerCase().includes(q)||(t.descricao||'').toLowerCase().includes(q);
    return ms&&mq;
  });
  const tl = document.getElementById('taskList');
  if(!filtered.length){
    tl.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div style="font-weight:600;font-size:14px;color:#888;margin-bottom:6px">${tasks.length===0?'Nenhuma demanda ainda':'Nada encontrado'}</div><div style="font-size:12px;color:#bbb">${tasks.length===0?'Clique em + Nova demanda para começar':'Tente outro filtro'}</div></div>`;
    return;
  }
  tl.innerHTML = filtered.map(t=>`
    <div class="task-card ${selectedId===t.id?'selected':''}" onclick="selectTask(${t.id})">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div class="task-title">${t.titulo}</div>
        <div class="prio-pill" style="background:${PRIO[t.prioridade].color}22;color:${PRIO[t.prioridade].color};white-space:nowrap">${PRIO[t.prioridade].label}</div>
      </div>
      ${t.descricao?`<div class="task-desc">${t.descricao}</div>`:''}
      <div class="task-footer">
        <div class="pill" style="background:${STATUS[t.status].bg};color:${STATUS[t.status].color}">${STATUS[t.status].label}</div>
        <div class="meta">${t.prazo?`<span>📅 ${t.prazo}</span>`:''}${t.tags&&t.tags.length?`<span>🏷 ${t.tags[0]}${t.tags.length>1?' +'+( t.tags.length-1):''}</span>`:''}</div>
      </div>
    </div>`).join('');
}

function showForm(){
  selectedId=null;
  document.getElementById('detail').style.display='none';
  document.getElementById('sidebar').className='sidebar full';
  document.getElementById('formArea').innerHTML=`
    <div class="form-card">
      <div style="font-weight:700;font-size:14px;margin-bottom:14px;color:#1A1A2E">Nova demanda</div>
      <input class="input" id="fTitulo" placeholder="Título*"/>
      <textarea class="input" id="fDesc" rows="2" placeholder="Descrição (opcional)"></textarea>
      <div class="row">
        <select id="fPrio"><option value="alta">Alta prioridade</option><option value="media" selected>Média prioridade</option><option value="baixa">Baixa prioridade</option></select>
        <input type="date" id="fPrazo"/>
      </div>
      <input class="input" id="fTags" placeholder="Tags (separadas por vírgula)"/>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn-primary" style="flex:1;border-radius:8px;padding:10px" onclick="addTask()">Adicionar</button>
        <button class="btn-secondary" style="flex:1;border-radius:8px;padding:10px" onclick="cancelForm()">Cancelar</button>
      </div>
    </div>`;
  renderList();
}

function cancelForm(){
  document.getElementById('formArea').innerHTML='';
  document.getElementById('sidebar').className='sidebar full';
}

function addTask(){
  const titulo = document.getElementById('fTitulo').value.trim();
  if(!titulo) return;
  const t = {
    id:Date.now(),titulo,
    descricao:document.getElementById('fDesc').value,
    status:'nova',
    prioridade:document.getElementById('fPrio').value,
    prazo:document.getElementById('fPrazo').value,
    tags:document.getElementById('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),
    criadaEm:new Date().toLocaleDateString('pt-BR')
  };
  tasks.unshift(t); save();
  document.getElementById('formArea').innerHTML='';
  renderStatusBar(); renderList();
  selectTask(t.id);
  aiMessages=[{role:'assistant',content:`Demanda **"${t.titulo}"** adicionada! Posso te ajudar a montar um plano de ação, levantar riscos ou definir os próximos passos.`}];
  renderDetail();
}

function selectTask(id){
  selectedId=id;
  aiMessages=[];
  document.getElementById('formArea').innerHTML='';
  document.getElementById('sidebar').className='sidebar';
  document.getElementById('detail').style.display='flex';
  renderList();
  renderDetail();
}

function renderDetail(){
  const t = tasks.find(x=>x.id===selectedId);
  if(!t) return;
  const d = document.getElementById('detail');
  d.style.display='flex';
  d.style.flexDirection='column';
  d.innerHTML=`
    <div class="detail-header">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div style="flex:1">
          <div class="detail-title">${t.titulo}</div>
          ${t.descricao?`<div class="detail-desc">${t.descricao}</div>`:''}
          <div class="detail-tags">
            <select class="status-select" style="background:${STATUS[t.status].bg};color:${STATUS[t.status].color}" onchange="updateStatus(${t.id},this.value)">
              ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v.label}</option>`).join('')}
            </select>
            <span class="pill" style="background:${PRIO[t.prioridade].color}22;color:${PRIO[t.prioridade].color}">Prioridade ${PRIO[t.prioridade].label}</span>
            ${t.prazo?`<span style="font-size:12px;color:#aaa">📅 ${t.prazo}</span>`:''}
            ${(t.tags||[]).map(tg=>`<span class="tag">#${tg}</span>`).join('')}
            <button class="delete-btn" onclick="deleteTask(${t.id})">Excluir</button>
          </div>
        </div>
        <button onclick="closeDetail()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#bbb">✕</button>
      </div>
    </div>
    <div class="chat" id="chatArea">${renderMessages()}</div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" placeholder="${apiKey?'Pergunte sobre esta demanda...':'Configure a IA primeiro...'}" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"/>
      <button class="send-btn" id="sendBtn" onclick="sendMsg()">↑</button>
    </div>`;
  scrollChat();
}

function renderMessages(){
  if(!aiMessages.length) return `
    <div class="chat-suggestions">
      <div style="font-size:32px;margin-bottom:10px">✨</div>
      <div style="font-weight:600;color:#1A1A2E;margin-bottom:6px;font-size:14px">Assistente de demanda</div>
      <div style="color:#aaa;font-size:13px;margin-bottom:20px">Posso te ajudar a montar plano de ação, identificar riscos ou estruturar os próximos passos.</div>
      <div>
        ${['Monte um plano de ação','Quais são os riscos?','Quais os próximos passos?','Como priorizar?'].map(s=>`<button class="suggestion-btn" onclick="useSuggestion('${s}')">${s}</button>`).join('')}
      </div>
      ${!apiKey?`<div class="warning">⚠️ Configure sua chave de API para usar a IA. <button onclick="openApiModal()">Configurar agora</button></div>`:''}
    </div>`;
  return aiMessages.map(m=>`<div class="msg ${m.role}" style="${m.role==='user'?'align-self:flex-end':'align-self:flex-start'}">${md(m.content)}</div>`).join('')
    +(aiLoading?`<div style="align-self:flex-start;background:#fff;border-radius:14px 14px 14px 4px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.06)"><span style="display:inline-flex;gap:5px">${[0,1,2].map(i=>`<span class="dot" style="animation:pulse 1s ${i*0.2}s infinite"></span>`).join('')}</span></div>`):'');
}

function md(t){
  return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/^(\d+)\.\s/gm,'<br/><strong>$1.</strong> ')
    .replace(/^[-•]\s/gm,'<br/>• ')
    .replace(/\n/g,'<br/>');
}

function scrollChat(){setTimeout(()=>{const c=document.getElementById('chatArea');if(c)c.scrollTop=c.scrollHeight},50)}

function useSuggestion(s){
  if(!apiKey){openApiModal();return}
  document.getElementById('chatInput').value=s;
  sendMsg();
}

async function sendMsg(){
  if(aiLoading) return;
  const input = document.getElementById('chatInput');
  const txt = input.value.trim();
  if(!txt) return;
  if(!apiKey){openApiModal();return}
  input.value='';
  aiMessages.push({role:'user',content:txt});
  aiLoading=true;
  document.getElementById('chatArea').innerHTML=renderMessages();
  scrollChat();

  const t = tasks.find(x=>x.id===selectedId);
  const ctx = t?`Demanda: "${t.titulo}", Status: ${STATUS[t.status].label}, Prioridade: ${PRIO[t.prioridade].label}, Descrição: "${t.descricao||'sem descrição'}", Prazo: ${t.prazo||'não definido'}, Tags: ${(t.tags||[]).join(', ')||'nenhuma'}.`:'';

  try{
    const r = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1000,
        system:`Você é uma assistente de gestão de demandas, parceira estratégica e prática. ${ctx} Responda em português brasileiro, de forma concisa. Use listas e passos numerados quando fizer sentido.`,
        messages:aiMessages.map(m=>({role:m.role,content:m.content}))
      })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error.message);
    const text = data.content.map(i=>i.text||'').join('\n');
    aiMessages.push({role:'assistant',content:text});
  }catch(e){
    aiMessages.push({role:'assistant',content:`Erro: ${e.message}`});
  }
  aiLoading=false;
  document.getElementById('chatArea').innerHTML=renderMessages();
  scrollChat();
}

function updateStatus(id,status){
  tasks=tasks.map(t=>t.id===id?{...t,status}:t);
  save(); renderStatusBar(); renderList(); renderDetail();
}

function deleteTask(id){
  tasks=tasks.filter(t=>t.id!==id);
  save(); selectedId=null;
  document.getElementById('detail').style.display='none';
  document.getElementById('sidebar').className='sidebar full';
  renderStatusBar(); renderList();
}

function closeDetail(){
  selectedId=null;
  document.getElementById('detail').style.display='none';
  document.getElementById('sidebar').className='sidebar full';
  renderList();
}

function openApiModal(){
  document.getElementById('apiKeyInput').value=apiKey;
  document.getElementById('apiModal').style.display='flex';
}
function closeApiModal(){document.getElementById('apiModal').style.display='none'}
function saveApiKey(){
  apiKey=document.getElementById('apiKeyInput').value.trim();
  localStorage.setItem('gd_apikey',apiKey);
  document.getElementById('aiBtn').textContent='✓ IA ativa';
  document.getElementById('aiBtn').className='btn-ai';
  closeApiModal();
  if(selectedId) renderDetail();
}

// Init
if(apiKey){document.getElementById('aiBtn').textContent='✓ IA ativa';document.getElementById('aiBtn').className='btn-ai'}
document.getElementById('sidebar').className='sidebar full';
renderStatusBar(); renderList();
</script>
</body>
</html>
